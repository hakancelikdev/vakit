name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'content.js'
      - 'build.js'
      # legal/* build.js'in girdisi (privacy/terms/ads-policy). Listede yoktu →
      # yalnız hukuki metni değiştiren bir commit deploy'u HİÇ tetiklemiyordu:
      # `docs/` doğru üretiliyor, commit'leniyor, ama yayına çıkmıyordu (2026-08-12).
      - 'legal/**'
      - 'apps.json'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'content.js'
      - 'build.js'
      # legal/* build.js'in girdisi (privacy/terms/ads-policy). Listede yoktu →
      # yalnız hukuki metni değiştiren bir commit deploy'u HİÇ tetiklemiyordu:
      # `docs/` doğru üretiliyor, commit'leniyor, ama yayına çıkmıyordu (2026-08-12).
      - 'legal/**'
      - 'apps.json'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: '24'

    # docs/index.html, docs/en/index.html, sitemap.xml, robots.txt and llms.txt
    # are generated from content.js. Regenerating them here proves the committed
    # copies match their source — otherwise a hand-edit to the HTML would be
    # silently deployed and then overwritten by the next build.
    - name: Verify generated pages are up to date
      run: |
        node build.js
        if ! git diff --quiet -- docs; then
          echo "::error::docs/ is out of date. Run 'npm run build' in site/ and commit the result."
          git diff --stat -- docs
          exit 1
        fi

    - name: Setup Pages
      uses: actions/configure-pages@v6

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: './docs'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
      if: github.ref == 'refs/heads/main'
