<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta name="apple-itunes-app" content="app-id=6748356813">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <title id="pageTitle">Sayfa bulunamadı - Vakit</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box }
        :root {
            --bg: oklch(0.985 0.004 80);
            --ink: oklch(0.18 0.01 250);
            --ink-2: oklch(0.35 0.01 250);
            --ink-3: oklch(0.55 0.008 250);
            --accent: #2A9D8F;
            --accent-ink: #1F7368;
            --rule: oklch(0.88 0.008 80);
            --paper: oklch(0.99 0.003 80);
            --serif: 'Instrument Serif', 'Times New Roman', serif;
            --sans: 'Inter', system-ui, sans-serif;
            --mono: ui-rounded, 'SF Pro Rounded', -apple-system, 'Inter', system-ui, sans-serif;
        }
        body {
            font-family: var(--sans);
            background: var(--bg);
            color: var(--ink);
            min-height: 100dvh;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 24px 16px;
            -webkit-font-smoothing: antialiased;
        }
        .card {
            max-width: 420px; width: 100%;
            background: var(--paper);
            border: 1px solid var(--rule);
            border-radius: 20px;
            padding: 48px 32px;
            text-align: center;
        }
        .subtitle { color: var(--ink-2); font-size: 15px; line-height: 1.6 }
        .footer-text { margin-top: 32px; font-family: var(--mono); font-size: 12px; color: var(--ink-3); letter-spacing: 0.04em }
        .footer-text a { color: var(--accent-ink); text-decoration: none }
        .not-found h1 { font-family: var(--serif); font-size: 72px; font-weight: 400; color: var(--ink-3); margin-bottom: 12px }
        .not-found .subtitle { margin-bottom: 32px }
        .btn-secondary {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 14px 28px; border-radius: 999px;
            border: 1px solid var(--rule);
            color: var(--ink-2); font-size: 15px; font-weight: 500;
            text-decoration: none; transition: all .2s;
        }
        .btn-secondary:hover { background: var(--paper); border-color: var(--ink); color: var(--ink) }
        .actions { display: flex; flex-direction: column; align-items: center; gap: 12px }
        .btn-primary {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 14px 28px; border-radius: 999px;
            background: var(--ink); color: var(--bg); font-size: 15px; font-weight: 500;
            text-decoration: none; transition: background .2s;
        }
        .btn-primary:hover { background: var(--accent-ink) }
    </style>
</head>
<body>

<div class="card not-found">
    <h1>404</h1>
    <p class="subtitle" id="notFoundSubtitle">Aradığınız sayfa bulunamadı.</p>
    <div class="actions">
    <!-- Campaign link: pt + ct, like every App Store link the build writes (content.js → storeLink). -->
    <a class="btn-primary" href="https://apps.apple.com/app/id6748356813?pt=127947182&amp;ct=site-404">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.6 13.4c0-2.4 2-3.5 2.1-3.6-1.1-1.6-2.8-1.8-3.4-1.9-1.5-.1-2.8.9-3.6.9-.7 0-1.9-.9-3.1-.9-1.6 0-3.1.9-3.9 2.4-1.7 2.9-.4 7.2 1.2 9.5.8 1.2 1.7 2.4 3 2.4 1.2 0 1.6-.8 3-.8s1.8.8 3.1.8c1.3 0 2.1-1.2 2.9-2.3.9-1.3 1.3-2.6 1.3-2.7-.1 0-2.6-1-2.6-3.8zm-2.5-7.1c.6-.8 1.1-1.9 1-3-.9.1-2 .6-2.7 1.4-.6.7-1.2 1.8-1 2.9 1 .1 2-.5 2.7-1.3z"/></svg>
        <span id="storeText">App Store'dan İndir</span>
    </a>
    <a class="btn-secondary" href="/">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span id="homeText">Ana Sayfaya Dön</span>
    </a>
    </div>
</div>

<p class="footer-text">
    <a href="/">Vakit</a> — <span id="footerSlogan">Namaz, Kıble, Kuran</span>
</p>

<script>
// "/" sends the visitor on to their language's page (language-detection.js),
// so the home link is right for every language; only the text here is tr/en.
(function () {
    var lang = 'tr';
    try {
        var saved = localStorage.getItem('preferredLanguage');
        if (saved) { if (saved !== 'tr') lang = 'en'; }
        else {
            var bl = (navigator.language || navigator.userLanguage || '').toLowerCase();
            if (!bl.startsWith('tr')) lang = 'en';
        }
    } catch (e) {}
    var t = {
        tr: { pageTitle: 'Sayfa bulunamadı - Vakit', notFound: 'Aradığınız sayfa bulunamadı.', home: 'Ana Sayfaya Dön', store: 'App Store\'dan İndir', slogan: 'Namaz, Kıble, Kuran' },
        en: { pageTitle: 'Page not found - Vakit', notFound: 'The page you are looking for was not found.', home: 'Go to Homepage', store: 'Download on the App Store', slogan: 'Prayer, Qibla, Quran' }
    };
    var s = t[lang];
    document.getElementById('pageTitle').textContent = s.pageTitle;
    document.getElementById('notFoundSubtitle').textContent = s.notFound;
    document.getElementById('homeText').textContent = s.home;
    document.getElementById('storeText').textContent = s.store;
    document.getElementById('footerSlogan').textContent = s.slogan;
    document.documentElement.lang = lang;
})();
</script>
</body>
</html>
